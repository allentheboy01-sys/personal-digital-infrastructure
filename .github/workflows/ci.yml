name: PDI CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/python3.13.txt
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  p3d-release-bundle:
    name: P3D release bundle qualification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BUNDLE_ROOT: ${{ runner.temp }}/pdi-p3d-release-bundle
    steps:
      - name: Check out exact reviewed candidate (never PR merge SHA)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed on candidate or source drift
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install exact build-only tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build setuptools
          python -m pip check
      - name: Build qualification-only release-input bundle
        run: |
          mkdir -p "$BUNDLE_ROOT"
          PYTHONPATH="$GITHUB_WORKSPACE/src" python scripts/build_p3d_release_bundle.py build \
            --source "$GITHUB_WORKSPACE" \
            --candidate "$EXPECTED_CANDIDATE_SHA" \
            --os-manifest "$GITHUB_WORKSPACE/.github/p3d/qualification-os-runtime.json" \
            --platform-tag manylinux_2_34_x86_64 \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-path .github/workflows/ci.yml \
            --run-identity "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output-dir "$BUNDLE_ROOT"
      - name: Verify bundle bytes and offline install before attestation
        run: |
          bundle="$BUNDLE_ROOT/pdi-p3d-release-input-$EXPECTED_CANDIDATE_SHA.tar"
          digests="$BUNDLE_ROOT/pdi-p3d-release-input-$EXPECTED_CANDIDATE_SHA.digests.json"
          bundle_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["BUNDLE_SHA256"])' "$digests")"
          PYTHONPATH="$GITHUB_WORKSPACE/src" python scripts/build_p3d_release_bundle.py verify \
            --bundle "$bundle" \
            --expected-candidate "$EXPECTED_CANDIDATE_SHA" \
            --expected-bundle-sha256 "$bundle_sha"
      - name: Generate official GitHub build provenance attestation
        uses: actions/attest-build-provenance@f057fd524d485ac48d9b534c235aad15b5bb303f # v3
        with:
          subject-path: ${{ runner.temp }}/pdi-p3d-release-bundle/pdi-p3d-release-input-${{ env.EXPECTED_CANDIDATE_SHA }}.tar
      - name: Independently verify attestation and bundle from bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle="$BUNDLE_ROOT/pdi-p3d-release-input-$EXPECTED_CANDIDATE_SHA.tar"
          digests="$BUNDLE_ROOT/pdi-p3d-release-input-$EXPECTED_CANDIDATE_SHA.digests.json"
          bundle_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["BUNDLE_SHA256"])' "$digests")"
          gh attestation verify "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
          PYTHONPATH="$GITHUB_WORKSPACE/src" python scripts/build_p3d_release_bundle.py verify \
            --bundle "$bundle" \
            --expected-candidate "$EXPECTED_CANDIDATE_SHA" \
            --expected-bundle-sha256 "$bundle_sha"
          python -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); [print(f"{key}={value[key]}") for key in sorted(value)]' "$digests"
      - name: Upload content-addressed qualification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdi-p3d-release-input-${{ env.EXPECTED_CANDIDATE_SHA }}
          path: |
            ${{ runner.temp }}/pdi-p3d-release-bundle/pdi-p3d-release-input-${{ env.EXPECTED_CANDIDATE_SHA }}.tar
            ${{ runner.temp }}/pdi-p3d-release-bundle/pdi-p3d-release-input-${{ env.EXPECTED_CANDIDATE_SHA }}.digests.json
          if-no-files-found: error
          retention-days: 14

  p3d-systemd-static:
    name: P3D systemd static verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify exact P3D units in a disposable offline root
        run: >-
          sudo python3 scripts/verify_p3d_systemd_static.py
          --root "$RUNNER_TEMP/p3d-systemd-static-root"
          --release-sha "$GITHUB_SHA"

  host-safe:
    name: Host safe
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install PDI and monorepo test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install -e deployment/jarvis/web/python
      - name: Validate installed dependencies
        run: python -m pip check
      - name: Run host-safe suite
        run: python -m pytest -q --ignore=tests/integration
      - name: Validate public documentation links
        run: python scripts/check_markdown_links.py
      - name: Run portability regression
        run: python -m pytest -q tests/test_public_deployment.py

  postgresql-integration:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pdi_ci_test
          POSTGRES_USER: pdi_ci
          POSTGRES_PASSWORD: pdi-ci-synthetic-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdi_ci -d pdi_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PDI_TEST_DATABASE_URL: >-
        postgresql+psycopg://pdi_ci:pdi-ci-synthetic-password@127.0.0.1:5432/pdi_ci_test
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install PostgreSQL 16 and disposable Restic clients
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16 restic
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install PDI test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip check
      - name: Apply Alembic to a fresh database
        env:
          DATABASE__URL: ${{ env.PDI_TEST_DATABASE_URL }}
        run: python -m alembic -c alembic.ini upgrade head
      - name: Run isolated database integration suite
        run: python -m pytest -q tests/integration

  package-clean-install:
    name: Package and clean install
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install source and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]' build
          python -m pip check
      - name: Run clean-clone composition regressions
        run: >-
          python -m pytest -q
          tests/test_cli.py
          tests/test_settings.py
          tests/test_mcp_bootstrap.py
          tests/test_public_deployment.py
      - name: Verify source migration assets
        run: python -m alembic -c alembic.ini heads
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check distribution boundaries
        run: python scripts/check_distribution.py dist
      - name: Install wheel in a fresh environment
        run: |
          python -m venv .artifact-venv
          .artifact-venv/bin/python -m pip install --upgrade pip
          .artifact-venv/bin/python -m pip install dist/*.whl
          .artifact-venv/bin/python -m pip check
      - name: Exercise installed public CLI
        env:
          DATABASE__URL: >-
            postgresql+psycopg://pdi_cli:pdi-cli-synthetic-password@127.0.0.1:5432/pdi_cli_test
        run: |
          .artifact-venv/bin/pdi --help
          .artifact-venv/bin/pdi sync --help
          timeout 10 .artifact-venv/bin/pdi mcp </dev/null
