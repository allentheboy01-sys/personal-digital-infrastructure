      - name: Download exact candidate qualification bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pdi-p3d-release-input-${{ env.EXPECTED_CANDIDATE_SHA }}
          path: ${{ runner.temp }}/pdi-p3d-wp6-input
      - name: Run root-owned A-B-C to read-only WP6 qualification
        shell: bash
        run: |
          set -euo pipefail
          python_executable="$(command -v python)"
          bundle="$RUNNER_TEMP/pdi-p3d-wp6-input/pdi-p3d-release-input-$EXPECTED_CANDIDATE_SHA.tar"
          digests="$RUNNER_TEMP/pdi-p3d-wp6-input/pdi-p3d-release-input-$EXPECTED_CANDIDATE_SHA.digests.json"
