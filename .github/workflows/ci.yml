    needs: p3d-release-bundle
    runs-on: ubuntu-latest
    env:
      EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PDI_TEST_DATABASE_URL: >-
        postgresql+psycopg://pdi_wp6:pdi-wp6-synthetic@127.0.0.1:5432/pdi_wp6_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pdi_wp6_test
          POSTGRES_USER: pdi_wp6
          POSTGRES_PASSWORD: pdi-wp6-synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdi_wp6 -d pdi_wp6_test"
          --health-interval 10s
